# Study 2 backbones (docs/project/rebuild_b_plan.md WP2; decision log 2026-11-05).
# backbones_v2.yaml is pinned by final_config_v1/v2 and stays unchanged; entries reused
# from it keep the same repo and revision. Serving keys match MODELS in
# notebooks/kaggle/vllm_serve_v1/vllm_serve_v1.ipynb. A model counts only after its WP2
# smoke (20/20 terminal, >= 95% parseable tool calls) is recorded in the decision log.
qwen3_8b: {from: backbones_v2, tier: 2, status: served}
llama31_8b: {from: backbones_v2, tier: 1, status: served}
gemma4_12b: {from: backbones_v2, tier: 1, status: served}
qwen35_9b:
  repo: Qwen/Qwen3.5-9B
  revision: null  # pin the SHA printed at first boot
  tier: 1
  gated: false
  license: apache-2.0
  architecture: Qwen3_5ForConditionalGeneration (hybrid Gated DeltaNet + full attention every 4th layer, head_dim 256, bf16 weights 19.3 GB)
  dtype: half  # T4 has no fast bf16; fp16 numerics unverified for linear attention
  tensor_parallel: 2
  max_model_len: 8192
  text_only: true
  status: unverified  # WP2 smoke pending
qwen36_35b_a3b_awq:
  repo: QuantTrio/Qwen3.6-35B-A3B-AWQ  # community AWQ of Qwen/Qwen3.6-35B-A3B (apache-2.0), 25.5 GB
