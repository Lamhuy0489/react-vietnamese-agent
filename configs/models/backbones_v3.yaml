  revision: null
  tier: 2
  gated: false
  license: apache-2.0
  architecture: Qwen3_5MoeForConditionalGeneration (256 experts, 8 active, ~3B active params; hybrid attention)
  dtype: half
  tensor_parallel: 2
  max_model_len: 4096
  enforce_eager: true
  text_only: true
  status: unverified  # risk: AWQ MoE kernels on sm75, 25.5 GB on 2x16 GB; fallback in plan section 7
