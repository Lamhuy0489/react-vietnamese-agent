  # backbone change in the decision log before choosing another model.
  repo: google/gemma-4-12B-it
  revision: null
  role: rq1
  gated: true
  dtype: half
  tensor_parallel: 2
  max_model_len: 8192
  vllm: nightly
  chat_template_kwargs: {}
