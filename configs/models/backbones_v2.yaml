# Roadmap v2 backbones (decision log 2026-10-23). One model per Kaggle notebook.
# revision: leave null until the first boot prints the resolved commit SHA, then
# pin it here and in the notebook before any Dev run that counts.
qwen3_8b:
  repo: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218  # resolved on Kaggle 2026-10-25
