name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_setup.py
      - run: python scripts/build_smoke_environment.py
      - run: python scripts/validate_smoke_data.py
      - run: python scripts/verify_phase1.py
      - run: ruff check .
      - run: mypy src scripts
      - run: pytest
